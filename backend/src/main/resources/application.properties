spring.application.name=Advanced Web Dev - Backend

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/fypdb
spring.datasource.username=postgres
## To be changed if ever deployed.
spring.datasource.password=postgres

##JPA config
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

##JWT config
jwt.private-key = classpath:jwt/app.key
jwt.public-key = classpath:jwt/app.pub
jwt.ttl = 1m
jwt.refresh-token-ttl = 1d