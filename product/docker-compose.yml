version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fypdb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: spring_backend
    depends_on:
      - db
    env_file:
      - backend/.env
    ports:
      - "8080:8080"

  frontend:
      build:
        context: ./frontend
        args:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      container_name: nextjs_frontend
      depends_on:
        - backend
#      environment:
#        NEXT_PUBLIC_API_URL: http://backend:8080
      ports:
        - "3000:3000"


volumes:
  db_data:
