spring.application.name=Advanced Web Dev - Backend
spring.config.import=optional:file:.env[.properties]

## Enter your database details here.
spring.datasource.driver-class-name=org.postgresql.Driver
# URl to your database : example - postgresql://localhost:5432/fypdb
spring.datasource.url=${DB_URI}
# Username for your database
spring.datasource.username=${DB_USER}
# Password for your database
spring.datasource.password=${DB_PASS}

##JPA config
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

##JWT config
## Generate a public/private key pair and store them in the jwt/ folder
jwt.private-key = classpath:jwt/app.key
jwt.public-key = classpath:jwt/app.pub

## Time to live for token and refresh token
jwt.ttl = 15m
jwt.refresh-token-ttl = 7d
