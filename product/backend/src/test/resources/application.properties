spring.application.name=Advanced Web Dev - Backend


#single db configuration
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password


spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

#initialisation scripts(Add only when required applicable to both single db config and multiple db config)
spring.sql.init.mode=always


##JWT config
jwt.private-key = classpath:jwt/app.key
jwt.public-key = classpath:jwt/app.pub
jwt.ttl = 15m
jwt.refresh-token-ttl = 7d